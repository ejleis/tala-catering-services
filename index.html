<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tala's Event Catering Services</title>
    <meta
      name="description"
      content="Tala's Event Catering Services — chef-led catering for weddings, corporate events, and private celebrations in Metro Manila, plus partner hotel bookings."
    />

    <!-- Fonts loaded via <link> rather than a CSS @import: avoids the
         render-blocking waterfall an @import creates. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      SECURITY: Content-Security-Policy is deliberately NOT set here as a meta
      tag. It must be sent as an HTTP *header* by your host (Vercel, Netlify,
      nginx) — see the "Security headers" section of README.md for the exact
      policy. A meta-tag CSP cannot use nonces, cannot set frame-ancestors, and
      breaks the Vite dev server, so it does more harm than good.
    -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
